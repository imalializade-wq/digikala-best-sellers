name: Daily Digikala Best Sellers

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: |
          if [ -z "$SHEET_WEBHOOK_URL" ]; then
            echo "SECRET IS EMPTY"
            exit 1
          else
            echo "SECRET EXISTS"
          fi
